<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Health Predictor - AI Insights</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Animated Background -->
    <div class="background">
        <div class="animated-dots"></div>
        <canvas id="particleCanvas"></canvas>
    </div>

    <!-- Floating Orbs -->
    <div class="orbs-container">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="orb orb-4"></div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Header Section -->
        <header class="header">
            <div class="header-content">
                <h1 class="title">Mental Health Predictor</h1>
                <p class="subtitle">AI-Powered Insights into Your Well-being</p>
                <div class="glow-line"></div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Left Section - Humanoid Face & Waves -->
            <section class="visual-section">
                <div class="face-container">
                    <svg class="humanoid-face" viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
                        <!-- Head -->
                        <ellipse cx="100" cy="80" rx="55" ry="65" class="head-fill" />
                        
                        <!-- Left Eye -->
                        <circle cx="75" cy="60" r="12" class="eye-outer" />
                        <circle cx="75" cy="60" r="8" class="eye-inner" />
                        <circle cx="76" cy="58" r="4" class="eye-pupil" />
                        
                        <!-- Right Eye -->
                        <circle cx="125" cy="60" r="12" class="eye-outer" />
                        <circle cx="125" cy="60" r="8" class="eye-inner" />
                        <circle cx="126" cy="58" r="4" class="eye-pupil" />
                        
                        <!-- Nose -->
                        <path d="M 100 75 L 95 95 L 105 95" class="nose" />
                        
                        <!-- Mouth -->
                        <path d="M 85 115 Q 100 125 115 115" class="mouth" />
                        
                        <!-- Aura Circle -->
                        <circle cx="100" cy="100" r="80" class="aura" />
                    </svg>

                    <!-- Gradient Waves -->
                    <div class="waves-container">
                        <svg class="wave" viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg">
                            <path class="wave-path wave-1" d="M 0,50 Q 150,0 300,50 T 600,50 T 900,50 T 1200,50 L 1200,120 L 0,120 Z" />
                        </svg>
                        <svg class="wave" viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg">
                            <path class="wave-path wave-2" d="M 0,60 Q 150,10 300,60 T 600,60 T 900,60 T 1200,60 L 1200,120 L 0,120 Z" />
                        </svg>
                        <svg class="wave" viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg">
                            <path class="wave-path wave-3" d="M 0,70 Q 150,20 300,70 T 600,70 T 900,70 T 1200,70 L 1200,120 L 0,120 Z" />
                        </svg>
                    </div>
                </div>

                <!-- Status Indicators -->
                <div class="status-indicators">
                    <div class="indicator">
                        <div class="indicator-dot pulse-dot"></div>
                        <span>Ready to Analyze</span>
                    </div>
                </div>
            </section>

            <!-- Right Section - Form -->
            <section class="form-section">
                <div class="form-card">
                    <form id="predictionForm" class="prediction-form">
                        <!-- Row 1: Age and Gender -->
                        <div class="form-row">
                            <div class="form-group">
                                <label for="age">Age *</label>
                                <input type="number" id="age" name="age" min="10" max="100" required>
                                <span class="error-text"></span>
                            </div>
                            <div class="form-group">
                                <label for="gender">Gender *</label>
                                <select id="gender" name="gender" required>
                                    <option value="">Select Gender</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                </select>
                                <span class="error-text"></span>
                            </div>
                        </div>

                        <!-- Row 2: Country -->
                        <div class="form-row">
                            <div class="form-group full-width">
                                <label for="country">Country *</label>
                                <select id="country" name="country" required>
                                    <option value="">Select Country</option>
                                    <option value="India">India</option>
                                    <option value="USA">USA</option>
                                    <option value="Canada">Canada</option>
                                    <option value="Australia">Australia</option>
                                    <option value="UK">UK</option>
                                    <option value="Germany">Germany</option>
                                    <option value="Mexico">Mexico</option>
                                    <option value="Turkey">Turkey</option>
                                    <option value="France">France</option>
                                    <option value="Other">Other</option>
                                </select>
                                <span class="error-text"></span>
                            </div>
                        </div>

                        <!-- Row 3: Academic Level -->
                        <div class="form-row">
                            <div class="form-group full-width">
                                <label for="academic_level">Academic Level *</label>
                                <select id="academic_level" name="academic_level" required>
                                    <option value="">Select Academic Level</option>
                                    <option value="High School">High School</option>
                                    <option value="Undergraduate">Undergraduate</option>
                                    <option value="Graduate">Graduate</option>
                                </select>
                                <span class="error-text"></span>
                            </div>
                        </div>

                        <!-- Row 4: Most Used Platform -->
                        <div class="form-row">
                            <div class="form-group full-width">
                                <label for="most_used_platform">Most Used Platform *</label>
                                <select id="most_used_platform" name="most_used_platform" required>
                                    <option value="">Select Platform</option>
                                    <option value="Facebook">Facebook</option>
                                    <option value="Instagram">Instagram</option>
                                    <option value="Twitter">Twitter</option>
                                    <option value="LinkedIn">LinkedIn</option>
                                    <option value="TikTok">TikTok</option>
                                    <option value="Snapchat">Snapchat</option>
                                    <option value="YouTube">YouTube</option>
                                    <option value="LINE">LINE</option>
                                    <option value="KakaoTalk">KakaoTalk</option>
                                    <option value="VKontakte">VKontakte</option>
                                    <option value="WhatsApp">WhatsApp</option>
                                    <option value="WeChat">WeChat</option>
                                </select>
                                <span class="error-text"></span>
                            </div>
                        </div>

                        <!-- Row 5: Purpose of Use -->
                        <div class="form-row">
                            <div class="form-group full-width">
                                <label for="purpose_of_use">Purpose of Use *</label>
                                <select id="purpose_of_use" name="purpose_of_use" required>
                                    <option value="">Select Purpose</option>
                                    <option value="Networking">Networking</option>
                                    <option value="Education">Education</option>
                                    <option value="Entertainment">Entertainment</option>
                                    <option value="News">News</option>
                                </select>
                                <span class="error-text"></span>
                            </div>
                        </div>

                        <!-- Row 6: Daily Usage and Unlocks -->
                        <div class="form-row">
                            <div class="form-group">
                                <label for="avg_daily_usage_hours">Daily Usage (hours) *</label>
                                <input type="number" id="avg_daily_usage_hours" name="avg_daily_usage_hours" min="0" max="24" step="0.5" required>
                                <span class="error-text"></span>
                            </div>
                            <div class="form-group">
                                <label for="daily_unlocks">Daily Unlocks *</label>
                                <input type="number" id="daily_unlocks" name="daily_unlocks" min="0" required>
                                <span class="error-text"></span>
                            </div>
                        </div>

                        <!-- Row 7: Study and Activity Hours -->
                        <div class="form-row">
                            <div class="form-group">
                                <label for="study_hours">Study Hours *</label>
                                <input type="number" id="study_hours" name="study_hours" min="0" max="24" step="0.5" required>
                                <span class="error-text"></span>
                            </div>
                            <div class="form-group">
                                <label for="physical_activity_hours">Activity Hours *</label>
                                <input type="number" id="physical_activity_hours" name="physical_activity_hours" min="0" max="24" step="0.5" required>
                                <span class="error-text"></span>
                            </div>
                        </div>

                        <!-- Row 8: Sleep and Stress -->
                        <div class="form-row">
                            <div class="form-group">
                                <label for="sleep_hours_per_night">Sleep Hours *</label>
                                <input type="number" id="sleep_hours_per_night" name="sleep_hours_per_night" min="0" max="24" step="0.5" required>
                                <span class="error-text"></span>
                            </div>
                            <div class="form-group">
                                <label for="stress_level">Stress Level *</label>
                                <select id="stress_level" name="stress_level" required>
                                    <option value="">Select Level</option>
                                    <option value="Low">Low</option>
                                    <option value="Medium">Medium</option>
                                    <option value="High">High</option>
                                    <option value="Very High">Very High</option>
                                </select>
                                <span class="error-text"></span>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="submit-btn">
                            <span class="btn-text">Analyze My Health</span>
                            <span class="btn-icon">→</span>
                        </button>
                    </form>

                    <!-- Error Message -->
                    <div id="formError" class="form-error"></div>
                </div>
            </section>
        </main>
    </div>

    <!-- Loading Modal -->
    <div id="loadingModal" class="modal hidden">
        <div class="loading-container">
            <div class="loading-spinner">
                <div class="spinner-ring"></div>
                <div class="spinner-ring"></div>
                <div class="spinner-ring"></div>
            </div>
            <p class="loading-text">Analyzing Your Mental Health Profile...</p>
        </div>
    </div>

    <!-- Result Modal -->
    <div id="resultModal" class="modal hidden">
        <div class="result-container">
            <div class="result-card">
                <div class="result-close" onclick="closeResult()">×</div>
                
                <div class="result-header">
                    <div class="result-icon">
                        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="50" cy="50" r="45" class="result-circle" />
                            <path d="M 30 50 L 45 65 L 70 35" class="result-checkmark" />
                        </svg>
                    </div>
                    <h2>Analysis Complete</h2>
                </div>

                <div class="result-content">
                    <div class="score-display">
                        <div class="score-label">Mental Health Score</div>
                        <div class="score-value" id="scoreValue">0.00</div>
                        <div class="score-unit">/100</div>
                    </div>

                    <div class="score-bar">
                        <div class="score-fill" id="scoreFill"></div>
                    </div>

                    <div class="score-interpretation" id="scoreInterpretation">
                        <!-- Populated by JS -->
                    </div>

                    <div class="wellness-tips">
                        <h3>Wellness Recommendations</h3>
                        <ul id="tipslist">
                            <!-- Populated by JS -->
                        </ul>
                    </div>
                </div>

                <button class="result-action-btn" onclick="resetForm()">Analyze Again</button>
            </div>
        </div>
    </div>

    <!-- Floating Particles (Visual Enhancement) -->
    <div class="floating-particles">
        <div class="particle particle-1"></div>
        <div class="particle particle-2"></div>
        <div class="particle particle-3"></div>
        <div class="particle particle-4"></div>
        <div class="particle particle-5"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
